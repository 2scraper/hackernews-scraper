name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw HTML dumps and the Scraper
        API's `x-debug` header do not. Replace them with `***`.

        A few things answer most reports faster than we can:

        - **Exit 4, zero rows?** The item or user may not exist (`No such
          item.` is a plain HTTP 200 answer), or the list ended. A served page
          that parsed to no rows is a bug, so attach the `--dump-html` file.
          See [TROUBLESHOOTING.md](../blob/main/TROUBLESHOOTING.md).
        - **Exit 3?** That means HTTP 403, which was not observed when this
          repo was written (every page kind was served with no key and no
          proxy), so it is worth reporting with the sidecar's `stop_reason`.
        - **A run that takes minutes?** `--delay` defaults to 30 seconds,
          because `robots.txt` asks for that.

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - scraper_api_client.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Which mode
      options:
        - listing
        - item
        - user
        - not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - No browser (scraper_api_client.py over plain HTTP)
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things: 3 is a
        refusal (HTTP 403), 4 is "ran fine, found nothing", 5 is "the
        data never arrived". The table is in the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py \
          --mode listing --url https://news.ycombinator.com/news \
          --pages 3 --delay 4 --out front_page
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: dump
    attributes:
      label: --dump-html output (optional)
      description: >-
        The exact bytes the parser saw, from `--dump-html page.html`, on
        success as well as failure. It contains usernames and strangers'
        comment text: remove anything you would not want public, or trim it
        to the few rows that show the problem.
      render: text

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        90 stories over 3 pages, as the site shows.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|beautifulsoup4|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true
